#######################################################################
# File name: my.ini - MySQL configuration for Uniform Server Reload
# Used by the optional MySQL module (UniServer-Reload_mysql_module.zip);
# the bundle itself ships MariaDB since 1.3.6. The MySQL settings the
# bundles up to 1.3.5 ran with, including the Reload development and
# server-load tuning (the same values scripts\tune-server-config.ps1 puts
# onto an existing installation).
########################################################################

[mysql]
default-character-set=utf8mb4

# SERVER SECTION The following options will be read by the MySQL Server.
[mysqld]
#Do not delete next line. Used for setting port when run as service
#{service_port}
bind-address=127.0.0.1
# server-id = 1  Comment Prevents error Cannot open table mysql/slave_master_info
server-id = 0
pid-file=mysql.pid
# Error log in the data folder, where UniController's "error log" menu
# entry looks for it (the engine default would be <computername>.err)
log_error=mysql.err
explicit_defaults_for_timestamp
#default-storage-engine=MYISAM
authentication_policy = caching_sha2_password

skip-external-locking
key_buffer_size = 32M
max_allowed_packet = 256M
table_open_cache = 4000
sort_buffer_size = 2M
read_buffer_size = 1M
read_rnd_buffer_size = 1M
net_buffer_length = 16K
thread_stack = 256K
tmp_table_size = 128M
max_heap_table_size = 128M

character-set-server=utf8mb4

# federated
skip-federated


# Uncomment the following if you are using InnoDB tables
innodb_file_per_table = 1
innodb_data_file_path = ibdata1:10M:autoextend
# Server sizing: the InnoDB buffer pool should hold the hot data set. On a box
# shared with Apache/PHP use 25-50% of RAM (16 GB box: 2G-4G); on a dedicated
# database server up to 70%. 512M is the developer-laptop default.
innodb_buffer_pool_size = 512M
innodb_redo_log_capacity = 256M
innodb_log_buffer_size = 32M
innodb_flush_log_at_trx_commit = 1
innodb_lock_wait_timeout = 50


# UniServer Reload - server load settings (see README, "Sized for a server")
max_connections = 500
thread_cache_size = 64
table_definition_cache = 2000
innodb_io_capacity = 1000
innodb_io_capacity_max = 2000
binlog_expire_logs_seconds = 604800
max_binlog_size = 256M

[mysqldump]
quick
max_allowed_packet = 256M

[mysql]
no-auto-rehash
# Remove the next comment character if you are not familiar with SQL
#safe-updates

[myisamchk]
key_buffer_size = 32M
sort_buffer_size = 2M

[mysqlhotcopy]
interactive-timeout
