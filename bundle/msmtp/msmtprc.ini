# ============================================================================
#  msmtp configuration - Uniform Server Reload
#  PHP mail() delivers through this file (via sendmail.bat / mail_wrapper.php,
#  which adds Date/Message-ID/MIME headers so mails score better with spam
#  filters).
#
#  Quick start:
#   1. Fill in ONE account block below with your real SMTP access data.
#   2. Set it as default at the end of this file:  account default : MyMail
#   3. Test with core\msmtp\Send_test_email.bat (log: core\msmtp\msmtp.log)
#
#  Getting past spam filters - the parts only YOU can do:
#   * Send through an authenticated SMTP account of a real provider (it will
#     DKIM-sign your mail). Never send directly from a home IP.
#   * The From: address in your PHP mails MUST match the authenticated
#     account (or a domain that provider is allowed to send for).
#   * For your own domain: set up SPF and DMARC DNS records and let your
#     provider handle DKIM.
#   * Gmail/Outlook: create an app password - normal passwords won't work.
# ============================================================================

defaults
tls on
tls_certcheck on
tls_trust_file ~\core\msmtp\cacert.pem
logfile ~\core\msmtp\msmtp.log

# --- Your mail provider (STARTTLS on port 587 - fits most providers) --------
account MyMail
host smtp.example.com
port 587
auth on
user you@example.com
password your-app-password
from you@example.com

# --- Alternative: implicit TLS on port 465 ----------------------------------
account MyMail465
host smtp.example.com
port 465
tls_starttls off
auth on
user you@example.com
password your-app-password
from you@example.com

# --- Gmail (requires an app password: myaccount.google.com > Security) ------
account Gmail
host smtp.gmail.com
port 587
auth on
user you@gmail.com
password your-16-char-app-password
from you@gmail.com

# --- Set the account PHP mail() uses ----------------------------------------
account default : MyMail
