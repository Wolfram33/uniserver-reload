#######################################################################
# File name: my.ini - MariaDB configuration for Uniform Server Reload
# Modeled on the upstream ZeroXV MariaDB module configuration with the
# localhost binding and service port marker from the MySQL base config.
########################################################################

[mysql]
default-character-set=utf8mb4

# SERVER SECTION The following options will be read by the MariaDB Server.
[mysqld]
#Do not delete next line. Used for setting port when run as service
#{service_port}
bind-address=127.0.0.1
server-id = 1
pid-file=mysql.pid

skip-external-locking
key_buffer_size = 16K
max_allowed_packet = 16M
table_open_cache = 10
sort_buffer_size = 64K
read_buffer_size = 256K
read_rnd_buffer_size = 256K
net_buffer_length = 2K
thread_stack = 256K

character-set-server=utf8mb4

innodb_file_per_table = 1
innodb_buffer_pool_size = 32M
innodb_flush_log_at_trx_commit = 1
innodb_lock_wait_timeout = 50

[mysqldump]
quick
max_allowed_packet = 16M

[mysql]
no-auto-rehash

[myisamchk]
key_buffer_size = 8M
sort_buffer_size = 8M
