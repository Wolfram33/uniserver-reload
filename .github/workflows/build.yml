name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build WinpachoController & WinpachoService
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version and stamp VersionInfo
        id: ver
        shell: pwsh
        run: |
          # Single source of truth: WinpachoController/reload_version.inc
          $inc = Get-Content 'WinpachoController/reload_version.inc' -Raw
          if ($inc -notmatch "US_RELOAD_VERSION\s*=\s*'([^']+)'") { throw 'US_RELOAD_VERSION not found in reload_version.inc' }
          $v = $Matches[1]
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            if ($tag -ne "v$v") { throw "Tag $tag does not match source version v$v - bump WinpachoController/reload_version.inc first" }
          }
          # Keep the exe VersionInfo of both controllers in sync with the source version
          $parts = @($v.Split('.')) + @('0', '0', '0')
          foreach ($lpi in 'WinpachoController/WinpachoController.lpi', 'WinpachoService/WinpachoService.lpi') {
            $x = Get-Content $lpi -Raw
            $x = $x -replace '<MajorVersionNr Value="\d+"/>', "<MajorVersionNr Value=`"$($parts[0])`"/>"
            $x = $x -replace '<MinorVersionNr Value="\d+"/>', "<MinorVersionNr Value=`"$($parts[1])`"/>"
            $x = $x -replace '<RevisionNr Value="\d+"/>',     "<RevisionNr Value=`"$($parts[2])`"/>"
            $x = $x -replace 'ProductVersion="[^"]*"',        "ProductVersion=`"$v`""
            Set-Content $lpi -Value $x -NoNewline
            Write-Host "Stamped $lpi with version $v"
          }

      # Lazarus via chocolatey is the flakiest step of the build: the download
      # stalls at times and then dies on chocolatey's timeout. Cache the
      # installed C:\lazarus between runs so only the first build after a
      # cache eviction pays the install. Bump the -v1 suffix in the key to
      # force a fresh install (e.g. to pick up a new Lazarus version).
      - name: Cache Lazarus
        id: lazarus-cache
        uses: actions/cache@v4
        with:
          path: C:\lazarus
          key: lazarus-${{ runner.os }}-v1

      - name: Install Lazarus
        if: steps.lazarus-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Two attempts: the throttled download usually succeeds on retry
          foreach ($attempt in 1..2) {
            choco install lazarus -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "choco install lazarus attempt $attempt failed ($LASTEXITCODE)"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate lazbuild
        id: lazbuild
        shell: pwsh
        run: |
          $candidates = @('C:\lazarus\lazbuild.exe', 'C:\tools\lazarus\lazbuild.exe')
          $lazbuild = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $lazbuild) {
            $found = Get-ChildItem -Path 'C:\' -Filter lazbuild.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $lazbuild = $found.FullName }
          }
          if (-not $lazbuild) { throw 'lazbuild.exe not found' }
          "path=$lazbuild" >> $env:GITHUB_OUTPUT

      - name: Build WinpachoController (Release)
        shell: pwsh
        run: |
          & '${{ steps.lazbuild.outputs.path }}' --build-mode=Release WinpachoController\WinpachoController.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build WinpachoService
        shell: pwsh
        run: |
          & '${{ steps.lazbuild.outputs.path }}' WinpachoService\WinpachoService.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: uniserver-binaries
          path: |
            WinpachoController/WinpachoController.exe
            WinpachoService/WinpachoService.exe
          if-no-files-found: error

  package-php-modules:
    name: Package PHP ${{ matrix.branch }} module
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 8.3 too: the base package's own 8.3.0 is replaced by the current 8.3
        branch: ['8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build module
        run: bash scripts/package-php-module.sh '${{ matrix.branch }}' dist

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: php-module-${{ matrix.branch }}
          path: dist/
          if-no-files-found: error

  bundle:
    name: Build all-in-one bundle
    # The MariaDB module is the bundle's database engine, so it is built
    # first and merged like the PHP modules
    needs: [build, package-php-modules, package-mariadb-module]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build bundle
        shell: pwsh
        run: ./scripts/build-bundle.ps1

      - name: Update base package mirror
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Self-healing mirror: archive the ZeroXV base package (downloaded by
          # build-bundle.ps1 as base.exe) as an asset of the base-package
          # release, so future builds no longer depend on SourceForge.
          $assets = (& gh release view base-package --json assets --jq '.assets[].name' 2>$null) -join "`n"
          if ($LASTEXITCODE -ne 0) {
            Write-Host '==> Creating base-package mirror release'
            & gh release create base-package --prerelease --title 'Base package mirror' --notes 'Mirror of the Uniform Server ZeroXV 15.0.2 base package, originally from SourceForge (https://sourceforge.net/projects/miniserver/). CI builds prefer this asset and fall back to SourceForge. Marked as prerelease so it never appears as the latest release.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create base-package release' }
            $assets = ''
          }
          if ($assets -notlike '*15_0_2_ZeroXV.exe*') {
            Write-Host '==> Uploading base package to mirror'
            Copy-Item base.exe 15_0_2_ZeroXV.exe
            & gh release upload base-package 15_0_2_ZeroXV.exe --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Mirror upload failed' }
          } else {
            Write-Host '==> Mirror already up to date'
          }

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: uniserver-allinone
          path: dist/
          if-no-files-found: error

  package-mariadb-module:
    name: Package MariaDB module
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build module
        shell: pwsh
        run: ./scripts/package-mariadb-module.ps1 -OutDir dist

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-module
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: [build, package-php-modules, bundle, package-mariadb-module]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine release parameters
        id: rel
        run: |
          # Tag push (vX.Y.Z) -> stable versioned release; branch push -> rolling latest
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "name=winpacho ${VERSION}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=Latest development build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect release files
        run: |
          # Archives only: the bare exes (self-extracting bundle, controller,
          # service) were quarantined or blocked by Defender/SmartScreen while
          # unsigned. The controller is updated from the bundle zip instead.
          # The .7z twin of the bundle is the small download (LZMA, solid).
          mkdir -p release
          find artifacts -name '*.zip' -exec cp {} release/ \;
          find artifacts -name 'winpacho.7z' -exec cp {} release/ \;
          find artifacts -name 'module-versions.txt' -exec cat {} \; | sort -u > release-versions.txt
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            mv release/winpacho.zip "release/winpacho-${VERSION}.zip"
            mv release/winpacho.7z  "release/winpacho-${VERSION}.7z"
          fi
          echo "Packaged versions:" && cat release-versions.txt
          ls -l release/

      - name: Build release notes
        run: |
          BUNDLE_ZIP_NAME="winpacho.zip"
          BUNDLE_7Z_NAME="winpacho.7z"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            BUNDLE_ZIP_NAME="winpacho-${VERSION}.zip"
            BUNDLE_7Z_NAME="winpacho-${VERSION}.7z"
          fi
          {
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "winpacho ${VERSION} - stable release."
              echo
              echo "Built from commit ${GITHUB_SHA} (tag ${GITHUB_REF_NAME})."
            else
              echo "Rolling development build (version line ${VERSION}) - automatically updated on every push."
              echo
              echo "Built from commit ${GITHUB_SHA} on branch ${GITHUB_REF_NAME}."
            fi
            echo
            echo "## Contents"
            echo
            echo "| File | Description |"
            echo "|---|---|"
            echo "| **${BUNDLE_ZIP_NAME}** | **All-in-one package: complete server with current Apache, MariaDB, Adminer and PHP 8.3/8.4/8.5 (8.5 preselected) - extract into an empty folder, start \`WinpachoController.exe\`, no further setup.** To update only the controller of an existing installation, take \`WinpachoController.exe\` and \`utils\\WinpachoService.exe\` out of this zip (see *New program names* below) |"
            echo "| ${BUNDLE_7Z_NAME} | The same bundle as a .7z: about half the download size (this is why the old self-extracting exe was smaller). Windows 11 23H2+ extracts it with Explorer, older Windows needs [7-Zip](https://www.7-zip.org/) |"
            echo "| winpacho_php83_module.zip | PHP 8.3 module - unzip into your server folder (the folder with WinpachoController.exe) |"
            echo "| winpacho_php84_module.zip | PHP 8.4 module - unzip into your server folder (the folder with WinpachoController.exe) |"
            echo "| winpacho_php85_module.zip | PHP 8.5 module - unzip into your server folder (the folder with WinpachoController.exe) |"
            echo "| winpacho_mariadb_module.zip | The bundle's database engine (MariaDB LTS) as a separate module - for installations that still run MySQL (1.3.5 or older, or the MySQL module up to 2.1.x): export your databases, delete \`core\\mysql\`, unzip into your server folder, import again |"
            echo
            echo "## Packaged component versions"
            echo
            sed 's/^/- /' release-versions.txt
            echo
            echo "The bundle is smoke-tested on every build: Apache is started on the CI"
            echo "runner and must serve a PHP-rendered page, MariaDB is started, PHP must"
            echo "connect to it and Adminer must log in to MariaDB and to an SQLite file,"
            echo "before the release is updated."
            echo
            echo "## Adminer replaces phpMyAdmin, MariaDB is the only engine (2.2.0)"
            echo
            echo "The database tool behind the controller's button is now **Adminer**: one"
            echo "PHP file instead of phpMyAdmin's 54 MB and 4,100 files, and it opens"
            echo "**SQLite** databases as well. The button logs in to MariaDB as root by"
            echo "itself, as phpMyAdmin did. For SQLite choose *System: SQLite*, enter the"
            echo "full path of the database file and the MariaDB root password (default"
            echo "\`root\`). Adminer answers on this computer only (\`Require local\`) and"
            echo "makes no calls to adminer.org (version check off)."
            echo
            echo "**MySQL is no longer shipped**: no \`winpacho_mysql_module.zip\` any more, and the"
            echo "controller has no MySQL-specific code left. An installation that still runs"
            echo "MySQL keeps starting, but the controller asks at every start to move to"
            echo "MariaDB (back up, replace \`core\\mysql\` with the MariaDB module, restore)."
            echo
            echo "**Updating an existing installation:** stop Apache, rename \`home\\us_opt1\`"
            echo "(the old phpMyAdmin) to e.g. \`us_opt1-phpmyadmin\`, copy \`home\\us_opt1\` from"
            echo "this zip, then copy the new controller. Limit the folder to this computer:"
            echo "run \`scripts\\tune-server-config.ps1\` from the repository, or in"
            echo "\`core\\apache2\\conf\\httpd.conf\` change \`Require all granted\` to \`Require local\`"
            echo "in the \`<Directory>\` block of \`home/us_opt1/\`. The phpMyAdmin leftovers in MariaDB (database \`phpmyadmin\`,"
            echo "user \`pma\`) do no harm and can be dropped in Adminer."
            echo
            echo "## New program names (2.1.0)"
            echo
            echo "The controller is now \`WinpachoController.exe\`, the service module"
            echo "\`utils\\WinpachoService.exe\` (until 2.0.0: \`UniController.exe\` and"
            echo "\`utils\\UniService.exe\`). To update an existing installation: stop Apache and"
            echo "MariaDB, close the controller, copy both files from the zip into the same"
            echo "places, then delete the old \`UniController.exe\` and \`utils\\UniService.exe\`."
            echo "Configuration, databases, \`www\` and installed Windows services stay as they are."
            echo "Used *Extra > Start with Windows*? The new controller detects the old start-up"
            echo "entry and explains the one-time conversion (one start as administrator)."
            echo "Own shortcuts and scripts that call \`UniController.exe\` need the new name."
            echo
            echo "## New name: winpacho (2.0.0)"
            echo
            echo "Uniform Server Reload is now **winpacho** - same project, same code, same"
            echo "maintainers, just its own name, so it is no longer mixed up with the"
            echo "unmaintained original. The download files are called \`winpacho-*.zip\` and"
            echo "\`winpacho_*_module.zip\` now; inside the package nothing moved (the controller,"
            echo "\`core\`, \`home\\us_config\` are where they were), so an existing installation"
            echo "updates exactly as before. Old links to \`github.com/Wolfram33/uniserver-reload\`"
            echo "redirect here. All credit for the original work stays with The Uniform Server"
            echo "Development Team (BSD license)."
            echo
            echo "## PHP security update (1.3.16): PHP2Shell"
            echo
            echo "Releases up to 1.3.15 shipped PHP 8.5.11, 8.4.26 and - from the base package -"
            echo "PHP 8.3.0. All three are affected by PHP2Shell (CVE-2026-109618 and"
            echo "CVE-2026-109619, CVSS 9.2): unauthenticated remote code execution through"
            echo "any PHP page served by Apache. Fixed in PHP 8.5.12, 8.4.27 and 8.3.36, which"
            echo "this release ships. PHP 8.3 is now packaged from windows.php.net like 8.4 and"
            echo "8.5 instead of being taken over from the 2023 base package."
            echo
            echo "**Please update now**, especially when Apache is reachable from other"
            echo "computers (it listens on all network interfaces by default). Either extract"
            echo "this bundle into a new folder and move your \`www\` and databases over, or update"
            echo "PHP in place: stop Apache, then unzip the PHP module zips above into your"
            echo "server folder (they replace \`core\php83\`, \`core\php84\` and \`core\php85\`;"
            echo "your own changes to the php_*.ini files in those folders are overwritten),"
            echo "then start Apache again. Check the running version via *PHP > View phpInfo*."
            echo
            echo "## Apache security update (1.3.13)"
            echo
            echo "Releases up to 1.3.12 shipped Apache 2.4.66, which is affected by the"
            echo "vulnerabilities fixed in 2.4.67, 2.4.68 and 2.4.69 (among them CVE-2026-23918,"
            echo "a mod_http2 double free rated *important*, and a Windows-specific"
            echo "out-of-bounds write via 8.3 short names, CVE-2026-59685). Please update."
            echo "To update Apache in an existing installation: stop Apache, then copy the"
            echo "folders \`bin\`, \`modules\`, \`include\`, \`lib\`, \`error\` and \`icons\` from"
            echo "\`core\\apache2\` of this bundle over yours. Your configuration stays as it is."
            echo "The new Apache build needs the Microsoft Visual C++ Redistributable 14.51"
            echo "or newer (https://aka.ms/vc14/vc_redist.x64.exe) - install it before copying."
            echo "A fresh 1.3.13 bundle warns before starting Apache when the installed runtime"
            echo "is older (key \`apache=14.51\` in section \`[VCRUNTIME]\` of us_config.ini)."
            echo
            echo "## MariaDB is the database engine (since 1.3.6)"
            echo
            echo "The bundle ships MariaDB instead of MySQL: the long-term-support release"
            echo "with the longest remaining support, everything included in the free build"
            echo "(thread pool, audit plugin, hot backups with \`mariadb-backup\`), lighter"
            echo "on Windows and without the MySQL 8 password-plugin trouble with older"
            echo "clients. It lives in \`core\\mysql\` on port 3306 as before, the controller"
            echo "menus say *MariaDB*, PHP's mysqli/PDO work unchanged."
            echo
            echo "**Still running MySQL** (1.3.5 or older, or the MySQL module up to 2.1.x)?"
            echo "The data folders are not compatible. Export your databases in the old"
            echo "installation (*MySQL > Database backup* or \`mysqldump\`), replace \`core\\mysql\`"
            echo "with \`winpacho_mariadb_module.zip\` (or unpack the new bundle), import them"
            echo "there (*MariaDB > Database restore*). Copying \`core\\mysql\\data\` across"
            echo "does not work."
            echo
            echo "Sized for a team, not just a laptop: OPcache is on in every PHP version,"
            echo "Apache logs rotate in place (\`logs\\rotated\\\` ring, bounded disk use),"
            echo "400 Apache worker threads, 500 MariaDB connections. Developer"
            echo "limits stay: PHP 512M memory / 256M uploads / 120s execution time;"
            echo "MariaDB 512M InnoDB pool (raise it on a server, see README) /"
            echo "256M max_allowed_packet. Existing installations get the same tuning"
            echo "with \`scripts\\tune-server-config.ps1\` from the repository."
            echo "1.3.3 opened a terminal window per log writer on every Apache start;"
            echo "since 1.3.4 the logs are written by the windowless \`rotatelogs_z.exe\`,"
            echo "and the controller converts a 1.3.3 configuration at the next Apache start."
            echo
            echo "Real e-mail from PHP mail(): enter your SMTP account in"
            echo "\`core\\msmtp\\msmtprc.ini\` (templates included). TLS certificate checks are"
            echo "on (CA bundle included) and outgoing mails automatically get the"
            echo "Date/Message-ID/MIME headers spam filters expect."
            echo
            echo "## Installation (all-in-one)"
            echo
            echo "1. Extract \`${BUNDLE_ZIP_NAME}\` into an **empty target folder without spaces in the path**"
            echo "   (e.g. \`C:\\winpacho\`) - the server files land directly in it, without the old"
            echo "   \`UniServerZ\` subfolder (Uniform Server ZeroXV 15.0.2 base with the fork controller"
            echo "   and the PHP 8.3/8.4/8.5 modules already integrated)."
            echo "2. Start \`WinpachoController.exe\` and start Apache and MariaDB."
            echo "3. PHP 8.5 is preselected (since 1.3.10; earlier bundles started on 8.3). To switch the PHP version: stop Apache first, then *PHP > Select PHP version*, then start Apache again."
            echo
            echo "Upgrading from an install with the old \`UniServerZ\` layout? Everything is fully"
            echo "portable: your existing folder keeps working as is - or, with the servers stopped,"
            echo "move the *contents* of \`UniServerZ\` one level up to adopt the flat layout."
            echo
            echo "## HTTPS without browser warning"
            echo
            echo "https://localhost works out of the box (the controller generates a localhost"
            echo "certificate on first start). On its first interactive start the controller asks"
            echo "right away whether to trust the certificate - answer Yes, confirm the Windows"
            echo "prompt, then restart the browser completely (Chrome: \`chrome://restart\`) and"
            echo "the 'not secure' warning is gone. Also available any time via"
            echo "*Apache > Apache SSL > Trust certificate in Windows*."
            echo "HTTP and HTTPS serve the same \`www\` folder in this bundle (upstream uses a"
            echo "separate ssl folder; restore that via \`US_ROOTF_SSL=./ssl\` in us_user.ini);"
            echo "with virtual hosts, unknown host names fall back to \`www\` on both ports."
            echo "Firefox ignores the Windows certificate store by default - when Firefox is"
            echo "installed, the controller offers to enable Mozilla's ImportEnterpriseRoots"
            echo "policy (current user only) so Firefox uses the Windows store too."
            echo
            echo "## Current PHP versions"
            echo
            echo "The original server never made it past PHP 8.3. This bundle ships PHP 8.3,"
            echo "8.4 and 8.5 preinstalled and switchable in the controller (*PHP > Select"
            echo "PHP version*), repackaged from the official windows.php.net builds - and"
            echo "every build is smoke-tested with each installed PHP version."
            echo
            echo "## The controller is the medallion"
            echo
            echo "Since 1.3.2 the controller's main window is the round 3D winpacho medallion"
            echo "itself: start buttons, utilities and status LEDs sit on the metal, the menus"
            echo "open from a tab row, and the window is dragged by any free spot of the coin."
            echo "Minimize and close with the small \`-\` / \`x\` buttons or Alt+F4. The tray icon"
            echo "has a right-click menu (*Show* / *Exit*) since 1.3.6. Since 1.3.12 only the \`-\`"
            echo "button sends the controller to the tray; a click on its taskbar button"
            echo "minimizes and restores it like any other Windows program. *Extra > Edit Win"
            echo "hosts file* no longer hides the controller when the editor opens. Since 1.3.1"
            echo "*Server Console* and *MariaDB Console* open in Windows Terminal with a"
            echo "translucent black background (opacity via \`CONSOLE_OPACITY\` in us_user.ini)."
            echo
            echo "## Running as a Windows service"
            echo
            echo "When Apache or MariaDB run as Windows services (installed via *Extra > Run"
            echo "Apache/MariaDB as Windows service*), the controller's buttons now read"
            echo "*Start/Stop Apache service* and control the service itself through the"
            echo "administrator (UAC) prompt instead of failing on the service's process."
            echo "LEDs and menus follow the service state. *Apache > Apache SSL > Trust"
            echo "certificate in Windows* stays available while Apache runs; the entries that"
            echo "edit httpd.conf or the certificate files say *stop Apache first*."
            echo
            echo "## Multiple virtual hosts - finally working"
            echo
            echo "Create as many virtual hosts as you like (*Apache > Apache Vhosts*): the"
            echo "controller now writes the Windows hosts file entries itself (deduplicated"
            echo "and verified), fixing the long-standing upstream problem that only one"
            echo "vhost ever resolved. Every vhost is served over http and https."
            echo "A document root whose path contains a space (Browse... to a folder such as"
            echo "\`D:\Projects\My App\`) is written quoted since 1.3.11; before, Apache refused"
            echo "to start with that vhost. Since 1.3.11 the controller also runs the Apache"
            echo "syntax check before every start and shows file, line and reason of a"
            echo "configuration error instead of waiting a minute and then failing silently."
            echo "Upgrading from an older install: delete \`core\\apache2\\server_certs\\server.crt\`"
            echo "and \`server.key\` first so a certificate with the subjectAltName entries"
            echo "Chrome requires gets generated."
            echo
            echo "Note: the executables are not code-signed yet; Windows SmartScreen may warn on first run"
            echo "(More info > Run anyway). Downloads are zip archives only - unsigned exe downloads"
            echo "were quarantined by Windows Defender as a false positive."
            echo
            echo "PHP binaries are the official thread-safe x64 builds from windows.php.net,"
            echo "repackaged in the winpacho module layout. Default timezone in the"
            echo "generated php inis is Europe/London - adjust \`date.timezone\` as needed."
            echo
            echo "---"
            echo
            echo "If winpacho saves you time, you can support its development:"
            echo "**[Donate via PayPal](https://www.paypal.com/paypalme/robderoy)** - thank you!"
          } > notes.md

      - name: Create/update release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          bodyFile: notes.md
          prerelease: ${{ steps.rel.outputs.prerelease }}
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          artifacts: release/*
