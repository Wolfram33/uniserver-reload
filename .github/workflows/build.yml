name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build UniController & UniService
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version and stamp VersionInfo
        id: ver
        shell: pwsh
        run: |
          # Single source of truth: UniController/reload_version.inc
          $inc = Get-Content 'UniController/reload_version.inc' -Raw
          if ($inc -notmatch "US_RELOAD_VERSION\s*=\s*'([^']+)'") { throw 'US_RELOAD_VERSION not found in reload_version.inc' }
          $v = $Matches[1]
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            if ($tag -ne "v$v") { throw "Tag $tag does not match source version v$v - bump UniController/reload_version.inc first" }
          }
          # Keep the exe VersionInfo of both controllers in sync with the source version
          $parts = @($v.Split('.')) + @('0', '0', '0')
          foreach ($lpi in 'UniController/UniController.lpi', 'UniService/UniService.lpi') {
            $x = Get-Content $lpi -Raw
            $x = $x -replace '<MajorVersionNr Value="\d+"/>', "<MajorVersionNr Value=`"$($parts[0])`"/>"
            $x = $x -replace '<MinorVersionNr Value="\d+"/>', "<MinorVersionNr Value=`"$($parts[1])`"/>"
            $x = $x -replace '<RevisionNr Value="\d+"/>',     "<RevisionNr Value=`"$($parts[2])`"/>"
            $x = $x -replace 'ProductVersion="[^"]*"',        "ProductVersion=`"$v`""
            Set-Content $lpi -Value $x -NoNewline
            Write-Host "Stamped $lpi with version $v"
          }

      # Lazarus via chocolatey is the flakiest step of the build: the download
      # stalls at times and then dies on chocolatey's timeout. Cache the
      # installed C:\lazarus between runs so only the first build after a
      # cache eviction pays the install. Bump the -v1 suffix in the key to
      # force a fresh install (e.g. to pick up a new Lazarus version).
      - name: Cache Lazarus
        id: lazarus-cache
        uses: actions/cache@v4
        with:
          path: C:\lazarus
          key: lazarus-${{ runner.os }}-v1

      - name: Install Lazarus
        if: steps.lazarus-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Two attempts: the throttled download usually succeeds on retry
          foreach ($attempt in 1..2) {
            choco install lazarus -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "choco install lazarus attempt $attempt failed ($LASTEXITCODE)"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate lazbuild
        id: lazbuild
        shell: pwsh
        run: |
          $candidates = @('C:\lazarus\lazbuild.exe', 'C:\tools\lazarus\lazbuild.exe')
          $lazbuild = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $lazbuild) {
            $found = Get-ChildItem -Path 'C:\' -Filter lazbuild.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $lazbuild = $found.FullName }
          }
          if (-not $lazbuild) { throw 'lazbuild.exe not found' }
          "path=$lazbuild" >> $env:GITHUB_OUTPUT

      - name: Build UniController (Release)
        shell: pwsh
        run: |
          & '${{ steps.lazbuild.outputs.path }}' --build-mode=Release UniController\UniController.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build UniService
        shell: pwsh
        run: |
          & '${{ steps.lazbuild.outputs.path }}' UniService\UniService.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: uniserver-binaries
          path: |
            UniController/UniController.exe
            UniService/UniService.exe
          if-no-files-found: error

  package-php-modules:
    name: Package PHP ${{ matrix.branch }} module
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: ['8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build module
        run: bash scripts/package-php-module.sh '${{ matrix.branch }}' dist

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: php-module-${{ matrix.branch }}
          path: dist/
          if-no-files-found: error

  bundle:
    name: Build all-in-one bundle
    needs: [build, package-php-modules]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build bundle
        shell: pwsh
        run: ./scripts/build-bundle.ps1

      - name: Update base package mirror
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Self-healing mirror: archive the ZeroXV base package (downloaded by
          # build-bundle.ps1 as base.exe) as an asset of the base-package
          # release, so future builds no longer depend on SourceForge.
          $assets = (& gh release view base-package --json assets --jq '.assets[].name' 2>$null) -join "`n"
          if ($LASTEXITCODE -ne 0) {
            Write-Host '==> Creating base-package mirror release'
            & gh release create base-package --prerelease --title 'Base package mirror' --notes 'Mirror of the Uniform Server ZeroXV 15.0.2 base package, originally from SourceForge (https://sourceforge.net/projects/miniserver/). CI builds prefer this asset and fall back to SourceForge. Marked as prerelease so it never appears as the latest release.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create base-package release' }
            $assets = ''
          }
          if ($assets -notlike '*15_0_2_ZeroXV.exe*') {
            Write-Host '==> Uploading base package to mirror'
            Copy-Item base.exe 15_0_2_ZeroXV.exe
            & gh release upload base-package 15_0_2_ZeroXV.exe --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Mirror upload failed' }
          } else {
            Write-Host '==> Mirror already up to date'
          }

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: uniserver-allinone
          path: dist/
          if-no-files-found: error

  package-mariadb-module:
    name: Package MariaDB module
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build module
        shell: pwsh
        run: ./scripts/package-mariadb-module.ps1 -OutDir dist

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-module
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: [build, package-php-modules, bundle, package-mariadb-module]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine release parameters
        id: rel
        run: |
          # Tag push (vX.Y.Z) -> stable versioned release; branch push -> rolling latest
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "name=UniServer Reload ${VERSION}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=Latest development build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -name '*.exe' -exec cp {} release/ \;
          find artifacts -name '*.zip' -exec cp {} release/ \;
          find artifacts -name 'module-versions.txt' -exec cat {} \; | sort -u > release-versions.txt
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            mv release/UniServer-Reload.exe "release/UniServer-Reload-${VERSION}.exe"
            mv release/UniServer-Reload.zip "release/UniServer-Reload-${VERSION}.zip"
          fi
          echo "Packaged versions:" && cat release-versions.txt
          ls -l release/

      - name: Build release notes
        run: |
          BUNDLE_NAME="UniServer-Reload.exe"
          BUNDLE_ZIP_NAME="UniServer-Reload.zip"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            BUNDLE_NAME="UniServer-Reload-${VERSION}.exe"
            BUNDLE_ZIP_NAME="UniServer-Reload-${VERSION}.zip"
          fi
          {
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "UniServer Reload ${VERSION} - stable release."
              echo
              echo "Built from commit ${GITHUB_SHA} (tag ${GITHUB_REF_NAME})."
            else
              echo "Rolling development build (version line ${VERSION}) - automatically updated on every push."
              echo
              echo "Built from commit ${GITHUB_SHA} on branch ${GITHUB_REF_NAME}."
            fi
            echo
            echo "## Contents"
            echo
            echo "| File | Description |"
            echo "|---|---|"
            echo "| **${BUNDLE_NAME}** | **All-in-one package: complete server with current Apache, MySQL and PHP 8.3/8.4/8.5 - just run it, no further setup** |"
            echo "| ${BUNDLE_ZIP_NAME} | Same all-in-one package as a plain zip (for setups where antivirus blocks the unsigned self-extracting exe): extract, then start \`UniServerZ\\UniController.exe\` |"
            echo "| UniController.exe | Controller only (replaces the one in an existing UniServerZ folder) |"
            echo "| UniService.exe | Windows service module |"
            echo "| ZeroXV_php84_module.zip | PHP 8.4 module - unzip into an existing UniServerZ root folder |"
            echo "| ZeroXV_php85_module.zip | PHP 8.5 module - unzip into an existing UniServerZ root folder |"
            echo "| ZeroXV_mariadb_module.zip | Latest MariaDB LTS as database engine - fresh installs only: delete \`core\\mysql\` first, then unzip into the UniServerZ root |"
            echo
            echo "## Packaged component versions"
            echo
            sed 's/^/- /' release-versions.txt
            echo
            echo "The bundle is smoke-tested on every build: Apache is started on the CI"
            echo "runner and must serve a PHP-rendered page before the release is updated."
            echo
            echo "Development-friendly limits are preconfigured: PHP 512M memory / 256M"
            echo "uploads / 120s execution time; MySQL/MariaDB 512M InnoDB pool / 256M"
            echo "max_allowed_packet and raised buffers."
            echo
            echo "Real e-mail from PHP mail(): enter your SMTP account in"
            echo "\`core\\msmtp\\msmtprc.ini\` (templates included). TLS certificate checks are"
            echo "on (CA bundle included) and outgoing mails automatically get the"
            echo "Date/Message-ID/MIME headers spam filters expect."
            echo
            echo "## Installation (all-in-one)"
            echo
            echo "1. Run \`${BUNDLE_NAME}\` and pick a target folder - it extracts a ready-to-use \`UniServerZ\` folder"
            echo "   (Uniform Server ZeroXV 15.0.2 base with the fork controller and the PHP 8.4/8.5 modules already integrated)."
            echo "2. Start \`UniServerZ\\UniController.exe\` and start Apache/MySQL."
            echo "3. To switch the PHP version: stop Apache first, then *PHP > Select PHP version*, then start Apache again."
            echo
            echo "## HTTPS without browser warning"
            echo
            echo "https://localhost works out of the box (the controller generates a localhost"
            echo "certificate on first start). On its first interactive start UniController asks"
            echo "right away whether to trust the certificate - answer Yes, confirm the Windows"
            echo "prompt, then restart the browser completely (Chrome: \`chrome://restart\`) and"
            echo "the 'not secure' warning is gone. Also available any time via"
            echo "*Apache > Apache SSL > Trust certificate in Windows*."
            echo "HTTP and HTTPS serve the same \`www\` folder in this bundle (upstream uses a"
            echo "separate ssl folder; restore that via \`US_ROOTF_SSL=./ssl\` in us_user.ini);"
            echo "with virtual hosts, unknown host names fall back to \`www\` on both ports."
            echo "Firefox ignores the Windows certificate store by default - when Firefox is"
            echo "installed, the controller offers to enable Mozilla's ImportEnterpriseRoots"
            echo "policy (current user only) so Firefox uses the Windows store too."
            echo
            echo "## Multiple virtual hosts - finally working"
            echo
            echo "Create as many virtual hosts as you like (*Apache > Apache Vhosts*): the"
            echo "controller now writes the Windows hosts file entries itself (deduplicated"
            echo "and verified), fixing the long-standing upstream problem that only one"
            echo "vhost ever resolved. Every vhost is served over http and https."
            echo "Upgrading from an older install: delete \`core\\apache2\\server_certs\\server.crt\`"
            echo "and \`server.key\` first so a certificate with the subjectAltName entries"
            echo "Chrome requires gets generated."
            echo
            echo "Note: the executables are not code-signed; Windows SmartScreen may warn on first run"
            echo "(More info > Run anyway)."
            echo
            echo "PHP binaries are the official thread-safe x64 builds from windows.php.net,"
            echo "repackaged in the Uniform Server module layout. Default timezone in the"
            echo "generated php inis is Europe/London - adjust \`date.timezone\` as needed."
            echo
            echo "---"
            echo
            echo "If UniServer Reload saves you time, you can support its development:"
            echo "**[Donate via PayPal](https://www.paypal.com/paypalme/robderoy)** - thank you!"
          } > notes.md

      - name: Create/update release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          bodyFile: notes.md
          prerelease: ${{ steps.rel.outputs.prerelease }}
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          artifacts: release/*
