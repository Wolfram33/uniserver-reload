name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build UniController & UniService
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lazarus
        run: choco install lazarus -y --no-progress
        shell: pwsh

      - name: Locate lazbuild
        id: lazbuild
        shell: pwsh
        run: |
          $candidates = @('C:\lazarus\lazbuild.exe', 'C:\tools\lazarus\lazbuild.exe')
          $lazbuild = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $lazbuild) {
            $found = Get-ChildItem -Path 'C:\' -Filter lazbuild.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $lazbuild = $found.FullName }
          }
          if (-not $lazbuild) { throw 'lazbuild.exe not found' }
          "path=$lazbuild" >> $env:GITHUB_OUTPUT

      - name: Build UniController (Release)
        shell: pwsh
        run: |
          & '${{ steps.lazbuild.outputs.path }}' --build-mode=Release UniController\UniController.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build UniService
        shell: pwsh
        run: |
          & '${{ steps.lazbuild.outputs.path }}' UniService\UniService.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: uniserver-binaries
          path: |
            UniController/UniController.exe
            UniService/UniService.exe
          if-no-files-found: error

  package-php-modules:
    name: Package PHP ${{ matrix.branch }} module
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: ['8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build module
        run: bash scripts/package-php-module.sh '${{ matrix.branch }}' dist

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: php-module-${{ matrix.branch }}
          path: dist/
          if-no-files-found: error

  bundle:
    name: Build all-in-one bundle
    needs: [build, package-php-modules]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build bundle
        shell: pwsh
        run: ./scripts/build-bundle.ps1

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: uniserver-allinone
          path: dist/UniServer-Reload.exe
          if-no-files-found: error

  release:
    name: Update rolling release
    if: github.event_name == 'push'
    needs: [build, package-php-modules, bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -name '*.exe' -exec cp {} release/ \;
          find artifacts -name '*.zip' -exec cp {} release/ \;
          find artifacts -name 'module-versions.txt' -exec cat {} \; | sort -u > release-versions.txt
          echo "Packaged PHP versions:" && cat release-versions.txt
          ls -l release/

      - name: Build release notes
        run: |
          {
            echo "Rolling development build - automatically updated on every push."
            echo
            echo "Built from commit ${GITHUB_SHA} on branch ${GITHUB_REF_NAME}."
            echo
            echo "## Contents"
            echo
            echo "| File | Description |"
            echo "|---|---|"
            echo "| **UniServer-Reload.exe** | **All-in-one package: complete server with PHP 8.3/8.4/8.5 - just run it, no further setup** |"
            echo "| UniController.exe | Controller only (replaces the one in an existing UniServerZ folder) |"
            echo "| UniService.exe | Windows service module |"
            echo "| ZeroXV_php84_module.zip | PHP 8.4 module - unzip into an existing UniServerZ root folder |"
            echo "| ZeroXV_php85_module.zip | PHP 8.5 module - unzip into an existing UniServerZ root folder |"
            echo
            echo "## Packaged PHP versions"
            echo
            sed 's/^/- /' release-versions.txt
            echo
            echo "## Installation (all-in-one)"
            echo
            echo "1. Run \`UniServer-Reload.exe\` and pick a target folder - it extracts a ready-to-use \`UniServerZ\` folder"
            echo "   (Uniform Server ZeroXV 15.0.2 base with the fork controller and the PHP 8.4/8.5 modules already integrated)."
            echo "2. Start \`UniServerZ\\UniController.exe\` and start Apache/MySQL."
            echo "3. To switch the PHP version: stop Apache first, then *PHP > Select PHP version*, then start Apache again."
            echo
            echo "Note: the executables are not code-signed; Windows SmartScreen may warn on first run"
            echo "(More info > Run anyway)."
            echo
            echo "PHP binaries are the official thread-safe x64 builds from windows.php.net,"
            echo "repackaged in the Uniform Server module layout. Default timezone in the"
            echo "generated php inis is Europe/London - adjust \`date.timezone\` as needed."
          } > notes.md

      - name: Create/update release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest development build
          bodyFile: notes.md
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          artifacts: release/*
